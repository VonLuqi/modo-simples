name: CI

on:
  push:
  pull_request:

# Um run por branch/PR: um push novo cancela o anterior ainda em andamento
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Node 22 LTS: lint-staged exige >=22.22.1 e ESLint 10 exige ^20.19 || ^22.13 (Node 20 já saiu de manutenção)
  NODE_VERSION: '22'

jobs:
  quality:
    name: Qualidade (format, lint, testes, build, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Antes do build: o prebuild reformata src/, então só aqui o src não formatado é pego
      - name: Formatação (prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Testes unitários + estrutura
        run: npm test

      - name: Cobertura (src/ — piso linhas 90, ramos 80, funções 80)
        run: |
          set -o pipefail
          npm run coverage | tee coverage.txt
          {
            echo '### Cobertura de testes (src/)'
            echo
            echo '```'
            sed -n '/start of coverage report/,/end of coverage report/p' coverage.txt | sed 's/^ℹ //'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # dist/ é versionado: o build tem que reproduzir exatamente o que foi commitado
      # bundle.cjs direto (não npm run build): o prebuild roda prettier --write em src/
      - name: Build + dist sem drift
        run: |
          node scripts/bundle.cjs
          git diff --exit-code dist

      - name: Auditoria de dependências (produção, nível high)
        run: npm audit --omit=dev --audit-level=high

      - name: Smoke dos examples
        run: npm run smoke:examples

      - name: Smoke do assistente de cursos
        run: npm run smoke:assistente

  e2e:
    name: E2E (Playwright + axe)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Testes E2E (desktop + mobile)
        run: npm run test:e2e

      - name: Relatório do Playwright (só em falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
