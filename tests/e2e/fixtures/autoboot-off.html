<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Host com auto-boot desligado</title>
  </head>
  <body>
    <header><a href="/">Início</a></header>
    <main>
      <h1>Auto-boot desligado</h1>
      <p>
        A lib é carregada, mas só sobe quando o integrador manda. Este texto tem
        densidade suficiente para a heurística achar o conteúdo principal sem
        pedir seleção manual, passando dos duzentos caracteres mínimos do
        detector de conteúdo.
      </p>
    </main>
    <script
      src="../../../dist/modo-simples.min.js"
      data-ms-autoboot="false"
    ></script>
  </body>
</html>
