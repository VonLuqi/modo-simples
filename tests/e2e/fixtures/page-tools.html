<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ferramentas de página — fixture do Modo Simples</title>
    <style>
      /* controles pequenos de propósito: o alvo mínimo de 44px tem de ampliar */
      #btn,
      #lnk,
      #fld {
        display: inline-block;
        width: 16px;
        height: 16px;
        padding: 0;
        font-size: 10px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="h">Título da página</h1>
      <div id="rh" role="heading" aria-level="2">Cabeçalho por papel</div>
      <p id="p">Texto comum.</p>
      <a id="lnk" href="#x">a</a>
      <button id="btn" type="button">b</button>
      <input id="fld" type="text" aria-label="Campo" />
    </main>
    <script src="../../../dist/modo-simples.min.js"></script>
  </body>
</html>
