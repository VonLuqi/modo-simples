<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lupa de texto — fixture do Modo Simples</title>
    <style>
      body {
        margin: 0;
        padding: 24px 16px 600px;
        font: 14px/1.4 sans-serif;
      }
      #p {
        margin: 40px 0;
        font-size: 14px;
      }
      #btn {
        display: block;
        margin: 24px 0;
        padding: 8px 12px;
      }
      #bottom {
        position: absolute;
        top: 700px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="h">Título da página</h1>
      <p id="p">Este é um parágrafo pequeno que a lupa deve ampliar.</p>
      <label for="nome">Nome</label>
      <input id="nome" value="Ana" />
      <label for="pw">Senha</label>
      <input id="pw" type="password" value="segredo123" />
      <button
        id="btn"
        type="button"
        onclick="window.__clicks = (window.__clicks || 0) + 1"
      >
        Enviar formulário
      </button>
      <p id="bottom">Texto lá embaixo da página.</p>
    </main>
    <script src="../../../dist/modo-simples.min.js"></script>
  </body>
</html>
